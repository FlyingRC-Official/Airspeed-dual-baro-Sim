[platformio]
default_envs = esp32-s3-devkitc-1

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
  -D MONITOR_BAUD=115200
  -D I2C_SLAVE_ADDRESS=0x28
  -D I2C_BUS_HZ=100000
  -D MS4525_PSI_RANGE=1.0f

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
build_unflags =
  -DARDUINO_USB_MODE=1
build_flags =
  ${env.build_flags}
  -D I2C_SDA_PIN=8
  -D I2C_SCL_PIN=9
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=0

[env:esp32dev]
board = esp32dev
build_flags =
  ${env.build_flags}
  -D I2C_SDA_PIN=21
  -D I2C_SCL_PIN=22
